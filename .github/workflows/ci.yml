name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting with Prettier
        run: pnpm run format:check

      - name: Run Linter
        run: pnpm run lint

      - name: Run Type Check
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build project
        run: pnpm run build

      - name: Check Built Pages
        run: pnpm run test:dist
